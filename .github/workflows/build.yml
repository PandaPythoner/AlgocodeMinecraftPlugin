on:
  push:
  workflow_dispatch:
jobs: 
  BuildPlugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build
    
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/libs/exam2022-1.0.jar
